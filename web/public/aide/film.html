<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Couture Gestion — film animé</title>
<style>
:root{--coton:#f2f4f8;--surface:#fff;--encre:#141b2d;--muted:#5b657a;--ligne:#d8deea;--indigo:#223a7a;--indigo-fonce:#14234d;--indigo-clair:#e6ebf8;--ocre:#d19a1f;--ocre-clair:#fbf0d3;--ok:#2b7a58;--ok-clair:#dff2e8;--alerte:#b13a26}
*{box-sizing:border-box;margin:0;user-select:none}
html,body{min-height:100%;background:#05080f}
body{height:100dvh;display:grid;place-items:center;overflow:hidden;padding:clamp(8px,2vw,28px);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--encre)}
#st{width:min(1180px,100%,calc((100dvh - 16px) * 16 / 9));height:auto;max-height:calc(100dvh - 16px);aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--coton);border-radius:clamp(0px,1.2vw,18px);box-shadow:0 18px 60px #0008;font-size:clamp(12px,1.35vw,21px)}
.sc{position:absolute;inset:0;padding:5% 6% 13%;display:flex;flex-direction:column;justify-content:center;gap:.65em;animation:fade .5s}
.d{background:var(--indigo-fonce);color:#fff}.l{background:var(--coton);color:var(--encre)}
h1{font-size:clamp(2.2em,5vw,4em);line-height:1}h1 b,.o{color:var(--ocre)}h2{font-size:clamp(1.4em,3vw,2.4em);line-height:1.1}h3{font-size:1em}.muted{color:var(--muted)}
.i{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(.7em) scale(.96)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.3)}}@keyframes grow{from{width:0}}@keyframes rise{from{height:0}}@keyframes pulse{50%{transform:scale(1.05)}}
.shell{display:grid;grid-template-columns:13em 1fr;min-height:18em;background:var(--coton);color:var(--encre);border:1px solid var(--ligne);border-radius:.8em;overflow:hidden;box-shadow:0 .5em 1.2em #14234d22}
.side{background:var(--indigo-fonce);color:#dfe5f7;padding:.8em .55em;display:flex;flex-direction:column;gap:.25em}.brand{font-weight:700;color:#fff;padding:.25em .45em .7em;display:flex;gap:.4em;align-items:center}.brand i{background:var(--ocre);color:#2a1e00;border-radius:.35em;padding:.22em;font-style:normal}.nav{padding:.4em .5em;border-radius:.45em;font-size:.72em;display:flex;gap:.45em;align-items:center}.nav.on{background:#ffffff1f;border-left:.18em dashed var(--ocre);color:#fff}.nav svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2}
.main{min-width:0;padding:.8em 1em}.top{height:2em;display:flex;gap:.5em;align-items:center;border-bottom:1px solid var(--ligne);font-size:.72em}.top b{font-size:1.1em}.space{flex:1}.avatar{border:1px solid var(--ligne);border-radius:.45em;padding:.3em .5em;background:#fff}.body{padding:1em 0}.body h3{margin-bottom:.7em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em}.stat,.card{background:var(--surface);border:1px solid var(--ligne);border-radius:.6em;padding:.65em}.stat strong{display:block;font-size:1.45em;color:var(--indigo)}.stat small{display:block;color:var(--muted);font-size:.7em}.card{display:flex;gap:.45em;align-items:center;font-size:.75em}.card span:last-child{margin-left:auto;font-weight:700;color:var(--indigo)}.badge{display:inline-block;border-radius:2em;padding:.18em .55em;font-size:.7em;background:var(--indigo-clair);color:var(--indigo);font-weight:600}.badge.ok{background:var(--ok-clair);color:var(--ok)}.badge.ocre{background:var(--ocre-clair);color:#8a5a00}.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--indigo);color:#fff;border-radius:.5em;padding:.55em .8em;font-weight:700;font-size:.75em}.btn.ocre{background:var(--ocre);color:#2a1e00}.btn.sec{background:transparent;border:1px solid var(--indigo);color:var(--indigo)}.row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}.icon{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}.measure{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em}.measure .card{display:block}.measure b{display:block;color:var(--indigo);font-size:1.15em;margin-top:.2em}.timeline{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin:1.5em .5em 1.1em}.timeline:before{content:"";position:absolute;top:.55em;left:.5em;right:.5em;border-top:.18em dashed var(--ocre)}.step{position:relative;text-align:center;font-size:.62em}.step i{display:grid;place-items:center;width:1.1em;height:1.1em;margin:auto;border-radius:50%;background:var(--ocre);animation:pop .5s both}.step b{display:block;margin-top:.5em;white-space:nowrap}.phone{max-width:18em;background:var(--indigo-fonce);border:.35em solid #0d1633;border-radius:1.3em;padding:.8em;color:#fff;align-self:center}.phone .card{background:#fff;color:var(--encre)}.progress{height:.45em;background:#ffffff33;border-radius:2em;overflow:hidden}.progress i{display:block;width:78%;height:100%;background:var(--ocre);animation:grow 1.5s .5s both}.bars{height:4em;display:flex;gap:.45em;align-items:flex-end}.bars i{flex:1;height:var(--h);background:var(--ocre);border-radius:.3em .3em 0 0;animation:rise 1s .8s both}.ring{width:4em;height:4em;border:.4em solid #fff;border-radius:50%;position:relative}.ring:after{content:"";position:absolute;left:-1.8em;right:-1.8em;top:50%;border-top:.2em dashed var(--ocre)}.fil{height:.22em;background:repeating-linear-gradient(90deg,var(--ocre) 0 2em,#0000 2em 3.2em);animation:grow 1.4s .2s both}
#cap{position:absolute;left:6%;right:6%;bottom:4.2%;background:#05080fcc;color:#fff;border-radius:.7em;padding:.55em .8em;font-size:.7em;line-height:1.3;text-align:center;z-index:5}#pg{position:absolute;top:0;left:0;height:.24em;background:var(--ocre);z-index:6;transition:width .6s}#ex{position:absolute;top:1.2em;right:1.5em;font-size:.55em;opacity:.6;z-index:6}
#ov{position:absolute;inset:0;z-index:9;background:#0a1028f2;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:.75em;padding:8%;font-size:clamp(13px,1.5vw,20px)}#ov label{display:block;font-size:.75em;opacity:.85}#ov select,#ov input[type=range]{width:100%;font:inherit;font-size:.9em;padding:.3em}#go{background:var(--ocre);color:#141b2d;border:0;border-radius:2em;padding:.7em;font:700 1.05em inherit;font-family:inherit;cursor:pointer}#fs{background:none;border:1px solid #fff6;color:#fff;border-radius:2em;padding:.4em;font:inherit;font-size:.8em;cursor:pointer}#ov p{font-size:.65em;opacity:.8;line-height:1.35}
@media(max-width:700px){body{padding:0}#st{width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));aspect-ratio:9/16;border-radius:0;font-size:clamp(12px,4.1vw,20px)}.sc{padding:12% 8% 25%}.shell{grid-template-columns:1fr;min-height:22em}.side{display:none}.main{padding:.8em}.grid{grid-template-columns:repeat(2,1fr)}.top{font-size:.68em}.body{padding:.8em 0}.measure{grid-template-columns:repeat(2,1fr)}#cap{left:8%;right:8%;bottom:5.5%;font-size:.62em}#ex{top:1.2em;right:1em}}
@media(min-width:701px) and (max-width:1000px){#st{aspect-ratio:4/3;font-size:clamp(12px,1.7vw,19px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="st">
<div id="pg"></div><div id="ex">Écrans Couture Gestion · données fictives</div><div id="cap">Couture Gestion</div>
<div id="ov">
<h1>COUTURE <b>GESTION</b></h1>
<p>Une visite guidée des vrais écrans et du circuit de votre atelier.</p>
<label>Voix française<select id="vs"></select></label>
<label>Vitesse de la voix<input id="rt" type="range" min=".8" max="1.2" step=".05" value="1"></label>
<label><input type="checkbox" id="mu"> Sans voix (sous-titres seulement)</label>
<button id="go">▶ Lancer le film</button><button id="fs">Plein écran</button>
<p>Le film s'adapte automatiquement à l'ordinateur, à la tablette et au téléphone. Touchez l'écran pour arrêter puis relancer la présentation.</p>
</div></div>
<script>
const I={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2"/><path d="M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a6 6 0 0 0-3-5.2"/>',orders:'<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>',scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="m8.5 7.5 11 6M8.5 16.5l11-6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.1 1.9c-1 .8-1.7 1.2-1.7 2.6M12 17h.01"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
const icon=(n)=>`<svg class="icon" viewBox="0 0 24 24">${I[n]||I.help}</svg>`;
const nav=(active)=>`<aside class="side"><div class="brand"><i>✂</i> COUTURE GESTION</div><div class="nav ${active==='home'?'on':''}">${icon('home')}Accueil</div><div class="nav ${active==='orders'?'on':''}">${icon('orders')}Commandes</div><div class="nav">${icon('scissors')}Mes tâches</div><div class="nav ${active==='users'?'on':''}">${icon('users')}Clients</div><div class="nav">${icon('chart')}Statistiques</div><div class="nav">${icon('help')}Aide</div></aside>`;
const topbar=(name)=>`<header class="top"><b>${name}</b><span class="space"></span><span class="avatar">AT · Propriétaire</span></header>`;
const shell=(active,name,body)=>`<div class="shell">${nav(active)}<section class="main">${topbar(name)}<div class="body">${body}</div></section></div>`;
const S=[
{c:'d',t:"Vous gérez un atelier de couture ? Voici Couture Gestion : vos clients, vos commandes et votre production réunis dans une interface claire, avec vos couleurs et vos repères.",h:`<div class="ring i"></div><h1 class=i>COUTURE<br><b>GESTION</b></h1><div class=fil></div><p class=i style="font-size:1.1em">Votre atelier de couture,<br><b class=o>sous contrôle.</b></p>`},
{c:'l',t:"Créez votre atelier en quelques minutes. Confirmez votre email, puis activez votre accès avec le code d'abonnement.",h:shell('home','Activation de l’abonnement',`<h3 class=i>Votre atelier est prêt</h3><div class="card i">${icon('home')}Atelier COUTURE KAYE <span>✓</span></div><div class="card i">✉ Email vérifié <span>✓</span></div><div class="card i">🔑 Code d’abonnement <span>Activé</span></div><div class="row i"><span class="badge ok">Accès actif</span><span class="muted">Un espace sécurisé pour votre équipe</span></div>`)},
{c:'l',t:"Depuis le tableau de bord, retrouvez en un coup d'œil les travaux à effectuer, les commandes en cours, les habits à valider et les paiements.",h:shell('home','Accueil',`<h3 class=i>Bonjour, Atelier COUTURE KAYE</h3><div class="grid"><div class="stat i"><strong>12</strong><small>Travaux à effectuer</small></div><div class="stat i"><strong>8</strong><small>Commandes en cours</small></div><div class="stat i"><strong>5</strong><small>Habits à valider</small></div><div class="stat i"><strong>245 000</strong><small>FCFA encaissés ce mois-ci</small></div><div class="stat i"><strong>3</strong><small>Rendez-vous à venir</small></div><div class="stat i"><strong>4</strong><small>Retouches à faire</small></div></div>`)},
{c:'l',t:"Enregistrez vos clients et leurs mesures : homme, femme, garçon ou jeune fille. Elles sont reprises automatiquement à chaque nouvelle commande.",h:shell('users','Clients',`<div class="row i"><h3>Clients</h3><span class="space"></span><span class="btn">+ Nouveau client</span></div><div class="row i"><span class="badge">Homme</span><span class="badge">Femme</span><span class="badge ocre">Garçon</span><span class="badge">Jeune fille</span></div><div class="card i">${icon('users')}Fanta Traoré <span>Client actif</span></div><div class="measure i"><div class=card>Poitrine<b>96 cm</b></div><div class=card>Taille<b>78 cm</b></div><div class=card>Hanches<b>102 cm</b></div></div>`)},
{c:'l',t:"Une commande peut contenir plusieurs habits, chacun avec sa photo et son modèle. Une date de rendez-vous peut être proposée selon la capacité de l'atelier.",h:shell('orders','Commandes',`<div class="row i"><h3>CMD-000024</h3><span class="badge ocre">En cours</span><span class="space"></span><span class="btn sec">Voir le détail</span></div><div class="card i">${icon('users')}Fanta Traoré <span>Rendez-vous : 24 juin</span></div><div class="grid"><div class="card i">🧵 Boubou <span>35 000 FCFA</span></div><div class="card i">🧵 Chemise <span>10 000 FCFA</span></div><div class="card i">🧵 Pantalon <span>18 000 FCFA</span></div></div><div class="row i"><span class="badge">3 habits</span><span class="muted">Photo et modèle pour chaque habit</span></div>`)},
{c:'d',t:"Pour chaque habit, vous choisissez les étapes : coupe, broderie, montage, finition et repassage. Une étape va à une personne précise ou à tous ceux qui ont le rôle.",h:shell('orders','Habit HAB-000024',`<h3 class=i>Le circuit de fabrication</h3><div class="timeline"><div class=step><i>✓</i><b>Coupe</b></div><div class=step><i>✓</i><b>Broderie</b></div><div class=step><i>✓</i><b>Montage</b></div><div class=step><i>4</i><b>Finition</b></div><div class=step><i>5</i><b>Repassage</b></div></div><p class=i style="font-size:.9em">Chaque étape est affectée à <b class=o>une personne</b> ou à <b class=o>un rôle</b>.</p>`)},
{c:'l',t:"L'employé appuie sur « J'ai pris cet habit », puis sur « Terminé ». L'heure et la durée de chaque étape sont enregistrées automatiquement.",h:shell('scissors','Mes tâches',`<div class="card i">${icon('scissors')}Montage · HAB-000024 <span>Ibrahim · Monteur</span></div><div class="row i"><span class="btn ocre">J’ai pris cet habit</span><span class="btn sec">Terminé</span></div><div class="card i">⏱ Heure de début <span>09:42</span></div><div class="row i"><span class="badge ok">Étape terminée</span><span class="muted">Durée : 48 min</span></div>`)},
{c:'d',t:"Chaque employé a ses rôles et ses droits, choisis par le propriétaire. Même sans adresse email, un identifiant suffit pour se connecter.",h:shell('users','Employés',`<h3 class=i>Employés et accès</h3><div class="card i">${icon('users')}Amadou Diarra <span><i class=badge>Brodeur</i> <i class=badge>Monteur</i></span></div><div class="card i">${icon('users')}Moussa Keïta <span><i class=badge ocre>Coupeur</i></span></div><p class=i style="font-size:.85em">Chaque membre utilise son identifiant d’atelier et ne voit que les actions autorisées.</p>`)},
{c:'l',t:"Quand toutes les étapes sont terminées, vous confirmez, indiquez l'emplacement de l'habit, puis prévenez le client en un clic.",h:shell('orders','Validation de l’habit',`<h3 class=i>Habit prêt à remettre</h3><div class="row i"><span class="badge">Étagère A</span><span class="badge ocre">Étagère B ✓</span><span class="badge">Étagère C</span></div><div class="card i">✅ Habit confirmé par le propriétaire <span>Prêt</span></div><div class="btn i" style="background:var(--ok)">💬 Prévenir le client</div>`)},
{c:'d',t:"Enregistrez les paiements : le reste à payer se calcule tout seul. Générez une facture PDF et suivez vos dépenses et vos statistiques.",h:shell('orders','Paiements et statistiques',`<div class="grid"><div class="stat i"><strong>45 000</strong><small>Total commande · FCFA</small></div><div class="stat i"><strong>15 000</strong><small>Reste à payer · FCFA</small></div><div class="stat i"><strong>23</strong><small>Commandes terminées</small></div></div><div class="row i"><span class="btn">🧾 Générer la facture PDF</span><span class="badge ok">Paiement enregistré</span></div><div class="bars i"><i style="--h:40%"></i><i style="--h:65%"></i><i style="--h:50%"></i><i style="--h:90%"></i></div>`)},
{c:'l',t:"Vos clients suivent leur habit depuis leur téléphone, sans créer de compte : la photo, l'étape en cours et un message quand c'est prêt.",h:`<h2 class=i>Le suivi client, sans compte</h2><div class=phone><div class="card i">🧵 HAB-000024 <span>Boubou</span></div><div class="progress i"><i></i></div><p class=i style="font-size:.75em;margin:.7em 0">Étape actuelle : Repassage</p><div class="btn i" style="background:var(--ok);width:100%">✓ Votre habit est prêt</div></div><p class=i style="text-align:center">Le client suit son habit depuis son téléphone.</p>`},
{c:'d',t:"Les données de chaque atelier sont isolées et protégées. Couture Gestion : votre atelier, sous contrôle. Essayez-le dès maintenant.",h:`<div class="ring i"></div><h2 class=i>Données isolées et protégées</h2><p class=i style="font-size:.9em">🔒 Chaque atelier ne voit que ses propres données.</p><h1 class=i style="font-size:1.9em">Couture <b>Gestion</b></h1><div class=fil></div><div class="btn ocre i">Commencer</div>`}
];
const $=s=>document.querySelector(s),st=$('#st'),ov=$('#ov'),cap=$('#cap'),pg=$('#pg'),vs=$('#vs');
const wait=ms=>new Promise(r=>setTimeout(r,ms));const TTS='speechSynthesis' in window;let V=[],run=0;
const score=v=>(/natural|online/i.test(v.name)?2:0)+(/google|microsoft|siri/i.test(v.name)?1:0);
function fill(){V=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)).sort((a,b)=>score(b)-score(a));vs.innerHTML=V.map((v,i)=>`<option value="${i}">${v.name}</option>`).join('')||'<option>Aucune voix française trouvée</option>'}
if(TTS){fill();speechSynthesis.onvoiceschanged=fill}
function say(t){return new Promise(r=>{if($('#mu').checked||!TTS||!V.length){wait(Math.max(3500,t.split(' ').length*360)).then(r);return}const min=wait(3000);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.voice=V[+vs.value]||null;u.rate=+$('#rt').value;let done=false;const f=()=>{if(!done){done=true;min.then(r)}};u.onend=f;u.onerror=f;speechSynthesis.speak(u);setTimeout(f,30000)})}
async function play(n){const id=++run;if(n>=S.length){if(TTS)speechSynthesis.cancel();$('#go').textContent='↺ Rejouer';ov.style.display='flex';return}const old=[...st.querySelectorAll('.sc')],d=document.createElement('div');d.className='sc '+S[n].c;d.innerHTML=S[n].h;st.appendChild(d);setTimeout(()=>old.forEach(e=>e.remove()),600);[...d.querySelectorAll('.i,.step i,.bars i')].forEach((e,k)=>e.style.animationDelay=(.2+k*.22)+'s');cap.textContent=S[n].t;pg.style.width=(n+1)/S.length*100+'%';await say(S[n].t);if(id!==run)return;await wait(450);if(id===run)play(n+1)}
$('#go').onclick=e=>{e.stopPropagation();ov.style.display='none';play(0)};$('#fs').onclick=e=>{e.stopPropagation();(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})};st.onclick=()=>{if(ov.style.display==='none'){run++;if(TTS)speechSynthesis.cancel();$('#go').textContent='▶ Recommencer';ov.style.display='flex'}};
</script>
</body>
</html>
